<!DOCTYPE html>
<html>
<head>
    <title>Edit Resource</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">
    <h4>Edit Cloud Resource</h4>

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input name="name" class="form-control" value="{{resource[2]}}" required>
        </div>

        <div class="mb-3">
            <label>Type</label>
            <input name="type" class="form-control" value="{{resource[3]}}" required>
        </div>

        <div class="mb-3">
            <label>Region</label>
            <input name="region" class="form-control" value="{{resource[4]}}" required>
        </div>

        <div class="mb-3">
            <label>Cost</label>
            <input name="cost" type="number" step="0.01" class="form-control" value="{{resource[5]}}" required>
        </div>

        <div class="mb-3">
            <label>Status</label>
            <input name="status" class="form-control" value="{{resource[6]}}" required>
        </div>

        <button class="btn btn-primary">Update</button>
        <a href="/dashboard" class="btn btn-secondary">Cancel</a>

    </form>
</div>

</div>
</body>
</html>
